server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # El TLS lo termina Nginx Proxy Manager, que va por delante.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ficheros subidos (disco "public" de Laravel). Servidos directamente del
    # volumen compartido; ^~ gana a la regex de estaticos de mas abajo, que
    # con try_files $uri daria 404 porque el symlink public/storage no existe
    # dentro de esta imagen.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_read_timeout 120;
    }

    # El HTML del Taller NO se cachea. Es la pieza que decide que version de
    # js, css y marcos se pide (van con ?v=), asi que si el navegador se queda
    # con un index viejo sigue pidiendo los assets viejos y los cambios no
    # aparecen aunque se haya subido el ?v=.
    #
    # Antes no llevaba ninguna cabecera de cache, y sin Cache-Control el
    # navegador aplica cache heuristica por su cuenta: servia el index de
    # memoria sin preguntar. Con no-cache se revalida siempre contra el ETag,
    # que es barato (304) y quita el problema de raiz.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|woff2?|ttf|ico|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
