name: Deploy to Production

# El despliegue lo hace el servidor: construye las imagenes Docker y levanta la
# pila. No se compila nada aqui, porque el Dockerfile ya trae sus etapas de
# composer y de assets, y duplicarlo solo daria dos resultados que pueden diferir.
#
# Arranca en manual hasta que el primer despliegue a mano salga bien. Para
# volver al automatico, descomenta el bloque `push`.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/apps/taponazo
            ./deploy.sh
